[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp72-control"
version = "0.1.0"
description = "Safety-focused control of the Multicomp Pro MP720115 oscilloscope over VXI-11/SCPI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    "psutil>=5.9",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
plot = ["numpy>=1.26", "matplotlib>=3.8"]
dev = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
mp72-control = "mp72_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
